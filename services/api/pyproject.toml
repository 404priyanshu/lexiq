[project]
name = "lexiq-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.161.1",
    "huggingface-hub>=2.3.0",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.1.6",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
# SWIG bindings in PyMuPDF trip a Python 3.12 deprecation on import; not ours to fix.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
