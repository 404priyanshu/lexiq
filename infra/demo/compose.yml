# Public demo: everything on one server behind Caddy (docs/DEMO_PLAN.md).
# Run from this directory with a filled-in .env (see .env.example); deploy.sh does the rest.
name: lexiq-demo

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      API_URL: http://api:8000
    restart: unless-stopped

  api:
    build: ../../services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lexiq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lexiq
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["https://${DOMAIN}"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Postgres and Redis publish no ports: only the API reaches them, on the compose network.
  postgres:
    image: paradedb/paradedb:0.26.0-pg17
    environment:
      POSTGRES_USER: lexiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lexiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiq -d lexiq"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.6.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
